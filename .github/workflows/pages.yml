# Publica el frontend (carpeta frontend/) en GitHub Pages.
# Requisitos (una sola vez): Settings > Pages > Source: "GitHub Actions".
# Variables opcionales (Settings > Secrets and variables > Actions > Variables):
#   API_BASE_URL     -> URL https de tu backend desplegado (vacío = "Modo demo")
#   GOOGLE_CLIENT_ID -> Client ID público de Google Sign-In
#   GOOGLE_SITE_VERIFICATION -> código de Search Console (método "Etiqueta HTML"), para pedir
#                               la revisión si Chrome marca el sitio como peligroso
# Nunca pongas OPENAI_API_KEY ni GEMINI_API_KEY aquí: el navegador las expondría.
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Escribir configuración pública
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
        run: |
          python3 - <<'PY'
          import json, os
          import re
          src = open("frontend/js/config.js").read()
          default_cid = (re.search(r'GOOGLE_CLIENT_ID:\s*"([^"]*)"', src) or [None, ""])[1]
          cfg = {"API_BASE_URL": os.environ.get("API_BASE_URL", ""),
                 "GOOGLE_CLIENT_ID": os.environ.get("GOOGLE_CLIENT_ID") or default_cid}
          open("frontend/js/config.js", "w").write(
              "// Generado por pages.yml (configuración pública, sin secretos)\n"
              f"window.INTERVIEWAI_CONFIG = {json.dumps(cfg)};\n")
          code = re.sub(r"[^A-Za-z0-9_-]", "", os.environ.get("GOOGLE_SITE_VERIFICATION", ""))
          if code and "google-site-verification" not in open("frontend/index.html", encoding="utf-8").read():
              html = open("frontend/index.html", encoding="utf-8").read()
              tag = f'<meta name="google-site-verification" content="{code}" />'
              open("frontend/index.html", "w", encoding="utf-8").write(html.replace("<head>", "<head>\n  " + tag, 1))
          PY
          rm -f frontend/nginx.conf
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
