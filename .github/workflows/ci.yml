# Pruebas del backend contra PostgreSQL real + escaneo de secretos en cada push.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: interviewai
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: interviewai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U interviewai" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cargar esquema
        run: PGPASSWORD=ci_only_password psql -h localhost -U interviewai -d interviewai_test -v ON_ERROR_STOP=1 -q -f database/init.sql
      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt pytest
      - name: Pruebas
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://interviewai:ci_only_password@localhost:5432/interviewai_test
        run: python -m pytest -q
      - name: Escaneo de secretos (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
