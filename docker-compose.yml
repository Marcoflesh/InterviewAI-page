# InterviewAI — entorno local (http://localhost:3000)
#   docker compose up --build -d
# Con el modelo local de respaldo (Ollama, ~2 GB extra):
#   docker compose --profile local-llm up --build -d
#   docker compose exec ollama ollama pull llama3.2:3b
#
# Las llaves se leen de `.env` (NUNCA se suben a GitHub; ver .gitignore).
# Los puertos de la base de datos y del backend solo escuchan en 127.0.0.1.

services:
  db:
    image: postgres:16.6-alpine
    container_name: interviewai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-interviewai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-interviewai}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-interviewai} -d ${POSTGRES_DB:-interviewai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:0.5.7
    container_name: interviewai-ollama
    restart: unless-stopped
    profiles: ["local-llm"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollamadata:/root/.ollama

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: interviewai-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-interviewai}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-interviewai}
      # >>> Llaves inyectadas desde .env (no se escriben aquí) <<<
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      EVALUATOR_PROVIDER: ${EVALUATOR_PROVIDER:-gemini}
      INTERVIEWER_PROVIDER: ${INTERVIEWER_PROVIDER:-openai}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SECRET_KEY: ${SECRET_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,https://marcoflesh.github.io}
      EMAIL_MX_CHECK: ${EMAIL_MX_CHECK:-strict}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      ENABLE_FOLLOWUP_QUESTIONS: ${ENABLE_FOLLOWUP_QUESTIONS:-false}
      FOLLOWUP_STAR_THRESHOLD: ${FOLLOWUP_STAR_THRESHOLD:-3}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: interviewai-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  pgdata:
  ollamadata:
