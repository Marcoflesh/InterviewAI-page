# InterviewAI — entorno local (http://localhost:3000)
#   docker compose up --build -d
# El Agente Entrevistador usa un modelo LOCAL y gratuito con Ollama (por defecto qwen3.5:4b, ~3.4 GB).
# La primera vez se descarga solo (servicio ollama-init): docker compose logs -f ollama-init
# Con tarjeta NVIDIA: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Las llaves se leen de `.env` (NUNCA se suben a GitHub; ver .gitignore).
# Los puertos de la base de datos y del backend solo escuchan en 127.0.0.1.

services:
  db:
    image: postgres:16.6-alpine
    container_name: interviewai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-interviewai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-interviewai}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-interviewai} -d ${POSTGRES_DB:-interviewai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    # Siempre la versión más nueva: los modelos nuevos (qwen3.5) exigen Ollama reciente
    # (con versiones viejas: "412 requires a newer version"). Para fijar una: OLLAMA_IMAGE en .env
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: interviewai-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    # Sin puertos hacia tu computadora: el backend le habla por la red interna de Docker
    # (http://ollama:11434). Así no choca con un Ollama que ya tengas instalado y nadie
    # de fuera puede usarlo. Para revisarlo: docker compose exec ollama ollama list
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Descarga el modelo local una sola vez (queda guardado en el volumen ollamadata)
  ollama-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: interviewai-ollama-init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama"]
    command: ["pull", "${OLLAMA_MODEL:-qwen3.5:4b}"]

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: interviewai-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # Sin dependencia de Ollama: si Ollama no arranca, el backend funciona igual
      # (usa las preguntas del banco) en lugar de no levantarse.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-interviewai}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-interviewai}
      # >>> Llaves inyectadas desde .env (no se escriben aquí) <<<
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      EVALUATOR_PROVIDER: ${EVALUATOR_PROVIDER:-gemini}
      EVALUATOR_RUBRIC_MODE: ${EVALUATOR_RUBRIC_MODE:-indicadores}
      QUESTION_PREFETCH_AHEAD: ${QUESTION_PREFETCH_AHEAD:-2}
      INTERVIEWER_PROVIDER: ${INTERVIEWER_PROVIDER:-ollama}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SECRET_KEY: ${SECRET_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,https://marcoflesh.github.io}
      EMAIL_MX_CHECK: ${EMAIL_MX_CHECK:-strict}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-true}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-low}
      ENABLE_FOLLOWUP_QUESTIONS: ${ENABLE_FOLLOWUP_QUESTIONS:-false}
      FOLLOWUP_STAR_THRESHOLD: ${FOLLOWUP_STAR_THRESHOLD:-3}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: interviewai-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Solo tu computadora. Para probar desde tu celular en la misma red usa "3000:80".
      - "127.0.0.1:3000:80"

volumes:
  pgdata:
  ollamadata:
