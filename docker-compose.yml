version: "3.9"

services:
  db:
    image: postgres:16.6-alpine
    container_name: interviewai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-interviewai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-interviewai_secret}
      POSTGRES_DB: ${POSTGRES_DB:-interviewai}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-interviewai} -d ${POSTGRES_DB:-interviewai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:0.5.7
    container_name: interviewai-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: interviewai-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-interviewai}:${POSTGRES_PASSWORD:-interviewai_secret}@db:5432/${POSTGRES_DB:-interviewai}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ENABLE_FOLLOWUP_QUESTIONS: ${ENABLE_FOLLOWUP_QUESTIONS:-false}
      FOLLOWUP_STAR_THRESHOLD: ${FOLLOWUP_STAR_THRESHOLD:-3}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: interviewai-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  ollamadata:
