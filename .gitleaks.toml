# Configuración del escáner de secretos usado en CI (gitleaks)
[extend]
useDefault = true

[allowlist]
description = "Librerías de terceros, valores de prueba y marcadores de posición de la documentación"
paths = [
  '''frontend/vendor/.*''',
  '''backend/tests/.*''',
]
regexes = [
  '''TU_LLAVE_REAL''',
  '''PON_AQUI''',
  '''CAMBIA_ESTA_CONTRASENA''',
  '''interviewai_secret''',
  '''ci_only_password''',
  '''Contrasena123''',
  '''interviewai_token''',
]
